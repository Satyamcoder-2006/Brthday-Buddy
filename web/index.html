<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Buddy - Never Miss a Celebration</title>
    <style>
        :root {
            --primary: #FF9500;
            --primary-dark: #FF6B00;
            --secondary: #FFD700;
            --bg-dark: #0A0A0A;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #FFFFFF;
            --text-dim: #B5B5B5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Abstract Background Elements */
        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 149, 0, 0.1) 0%, rgba(255, 149, 0, 0) 70%);
            top: -200px;
            right: -200px;
            z-index: -1;
        }

        .bg-glow-bottom {
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.05) 0%, rgba(255, 215, 0, 0) 70%);
            bottom: -100px;
            left: -100px;
            z-index: -1;
        }

        header {
            width: 100%;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--secondary) 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            max-width: 800px;
            width: 100%;
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-icon {
            font-size: 80px;
            margin-bottom: 30px;
            filter: drop-shadow(0 0 20px rgba(255, 149, 0, 0.3));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-15px);
            }
        }

        h1 {
            font-size: clamp(32px, 8vw, 56px);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 20px;
            letter-spacing: -1.5px;
        }

        p.subtitle {
            font-size: clamp(16px, 4vw, 20px);
            color: var(--text-dim);
            max-width: 500px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .cta-container {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .btn {
            padding: 20px 32px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(255, 149, 0, 0.3);
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 40px rgba(255, 149, 0, 0.4);
        }

        .btn-secondary {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            backdrop-filter: blur(10px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        footer {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-dim);
            font-size: 14px;
        }

        .invite-hint {
            margin-top: 30px;
            font-size: 14px;
            color: var(--text-dim);
            background: var(--card-bg);
            padding: 12px 24px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .invite-hint strong {
            color: var(--secondary);
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>
    <div class="bg-glow-bottom"></div>

    <header>
        <div class="logo">Birthday Buddy</div>
    </header>

    <main>
        <div class="hero-icon">🎂</div>
        <h1>Celebrate Everyone You Love.</h1>
        <p class="subtitle">The production-grade birthday companion that makes every celebration special with AI
            planning and smart widgets.</p>

        <div class="cta-container">
            <a href="https://github.com/Satyamcoder-2006/Brthday-Buddy/releases/download/v.1.1/birthdaybuddy.apk"
                download class="btn btn-primary">
                Download for Android
            </a>
            <div class="invite-hint">
                Have an invite? Click the <strong>link</strong> shared by your buddy.
            </div>
        </div>
    </main>

    <footer>
        &copy; 2026 Birthday Buddy. Built with precision for production.
    </footer>
</body>

</html>
